$kind: http-request
name: "03. PATCH /api/v1/me/password (Ganti Password) [Dibuat: 2026-10-31] [TESTED]"
url: "{{base_url}}/api/v1/me/password"
method: PATCH
headers:
  Accept: application/json
  Content-Type: application/json
  Authorization: Bearer {{access_token}}
body:
  type: json
  content: |-
    {
      "current_password": "{{login_password}}",
      "new_password": "replace-with-a-new-password"
    }
order: 3000
