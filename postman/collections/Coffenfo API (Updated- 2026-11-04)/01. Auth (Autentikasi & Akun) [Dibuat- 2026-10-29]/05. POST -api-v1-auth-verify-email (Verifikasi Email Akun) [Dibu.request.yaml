$kind: http-request
name: "05. POST /api/v1/auth/verify-email (Verifikasi Email Akun) [Dibuat: 2026-10-28] [TESTED]"
url: "{{base_url}}/api/v1/auth/verify-email"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{verification_token}}"
    }
order: 5000
